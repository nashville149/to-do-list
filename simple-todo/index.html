<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My To-Do List</h1>
        </header>

        <div class="add-task-section">
            <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="100">
            <input type="datetime-local" id="taskDate">
            <button id="addBtn">Add Task</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="incomplete">⬜ Incomplete</button>
            <button class="filter-btn" data-filter="done">✅ Done</button>
            <button class="filter-btn" data-filter="undone">❌ Undone</button>
        </div>

        <div class="stats">
            <span id="taskCount">0 tasks</span>
        </div>

        <ul id="taskList" class="task-list"></ul>

        <div class="empty-state" id="emptyState">
            <p>No tasks yet. Add one above! 🎯</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
